# =====================================================================
#  doorwatch × Home Assistant —— 自动化
#
#  放法:复制到 HA 的 configuration.yaml 里(顶层),或者
#        configuration.yaml 里加一行:
#            automation: !include automations.yaml
#
#  语法说明:用的是 HA 2024.10+ 的新写法(triggers / conditions / actions)。
#    新版 HA 里 `service:` 已经被 `action:` 取代,老的 `platform:` 触发器
#    写法也会弹弃用警告 —— 与其将来再改,不如一步到位。
#
#  ★ 三条自动化:
#    1. 状态变化 → 立刻推给 doorwatch(门一开,看板马上变)
#    2. 每分钟体检 → 刷新模板 + 推状态和心跳;读不到就立刻推 offline
#    3. HA 启动 → 补发一次
#
#  ★ 这里出现的 sensor.xxx 全是 templates.yaml 里定义的模板实体,
#    名字固定,你不用改。
#    真正需要你改的只有 templates.yaml 一个文件里的三样东西:
#       · binary_sensor.isa_dw2hl_b95b_magnet_sensor → 门磁实体 id(本仓库已填好)
#       · DOOR_ON_MEANS_OPEN             → 方向开关(看板显示反了就翻它)
#       · STALE_SECONDS                 → 多久没更新算失联
#
#  ★ deviceId(主题最后一段)必须和 doorwatch 的 config/doors.json
#    里的 deviceId 完全一致,这里写 it-office-door。
#
#  ★★ HA 模板语法坑(写之前先看一眼,否则自动化会每分钟报错):
#      states('entity.id')        → 只返回**状态文本**,例如 "on"
#      states.entity.id.state     → 状态文本
#      states.entity.id.attributes → 属性字典
#      states.entity.id.last_reported / last_updated / last_changed → 时间戳
#      也就是说:要拿时间戳,必须用「对象写法」states.entity.id.xxx,
#      写成 states('entity.id').last_updated 会直接抛模板错误。
# =====================================================================

- id: doorwatch_it_office_state
  alias: "门磁状态 → doorwatch(IT 办公室)"
  description: "门磁开合变化时,把状态推给 doorwatch。看板据此显示开/关。"
  mode: queued
  max: 5
  triggers:
    - trigger: state
      entity_id: sensor.doorwatch_it_office_door_state
  actions:
    # ★ 注意这里**不**限制状态只能是 OPEN/CLOSED。
    #   模板在传感器读不到时会输出 UNKNOWN,那正是最该上报的时刻:
    #   doorwatch 收到 UNKNOWN 会立刻把状态打回"未知",
    #   而不是继续显示上次的开/关。
    - action: mqtt.publish
      data:
        topic: "doorwatch/it-office-door/state"
        payload: "{{ states('sensor.doorwatch_it_office_door_state') }}"
        qos: 1
        retain: true

# ---------------------------------------------------------------------
#  ★ 这条是本项目正确性的关键,别删。
#
#  为什么要"每分钟体检",而不是光靠心跳超时:
#
#    模板实体默认只在"它引用的实体变了"时才重算。
#    而传感器死了以后,状态值是不变的('on' 还是 'on'),
#    于是模板也不会重算,新鲜度判据会一直卡在最后一次的结果上 ——
#    传感器已经死了,模板还写着 OPEN。
#
#    update_entity 就是来解决这件事的:每分钟强行算一次。
#    (HA 源码:update_entity → async_update_ha_state(force_refresh=True)
#      → async_device_update() → TemplateEntity.async_update() → 重新渲染模板)
#
#  ★★★ 判断"还活着吗"的三道条件,必须同时成立: ★★★
#
#    ① fresh  —— 原始门磁的 last_reported 在 STALE_SECONDS(180 秒)之内
#    ② readable 说能读到(binary_sensor.doorwatch_it_office_door_readable == 'on')
#    ③ 状态模板给出了明确答案(OPEN / CLOSED,不是 UNKNOWN)
#
#    ① 是**新加的**,也是这次线上事故的直接原因,必须看懂:
#
#      ★ 模板实体的 last_reported 是不推进的,绝对不能拿它判死活。
#
#      HA 源码(homeassistant/helpers/event.py,
#      TrackTemplateResultInfo._render_template_if_ready):
#
#          if result == last_result and template in self._last_result:
#              return True          # ← 结果没变,连 update 都不产生
#
#      结果没变 → 不产生 update → 回调不跑 → async_write_ha_state() 不跑
#      → 状态压根没被写进 state machine → **last_reported 永远不动**。
#
#      所以模板实体的 last_reported 冻结在「值最后一次变化」的那一刻。
#      拿它算新鲜度,必然在两分钟后变成"过期" → 保险丝永远不通过
#      → 每分钟都推 offline → 看板永远显示"状态未知"。
#
#      ★ 而**原始门磁**不一样:xiaomi_miot 每轮轮询都会写一次状态,
#        值没变时 HA 走 async_set_internal 的"提前返回"分支,
#        **只更新 last_reported**。所以原始门磁的 last_reported 是真在推进的
#        (实测每次 doctor 跑起来都是"几秒前")—— 这才是可信的存活信号。
#
#      ★★ 顺便记住:**模板实体的「值」是准的,只是它的时间戳不准。**
#         值每分钟被 update_entity 重算一次,只是"没变就不写回去"。
#         所以 ② ③ 可以放心用**值**来判断,只有「时间戳」不能用。
#
#    三条路径各自独立地保护"不许撒谎"这条底线:
#    · 上面的状态变化自动化 → 推 UNKNOWN → doorwatch 立刻打回未知
#    · 这条体检自动化       → 推 offline → doorwatch 立刻打回未知
#    · doorwatch 自己的心跳超时(180 秒)→ 兜底
#    任何一条生效,看板都不会继续显示上次的开/关。
# ---------------------------------------------------------------------
- id: doorwatch_it_office_report
  alias: "每分钟体检 → doorwatch(IT 办公室)"
  description: "每分钟刷新模板实体,确认传感器还活着;活着就推状态+心跳,读不到就立刻推 offline。"
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/1"
  actions:
    # ① 强制模板实体重算,让新鲜度判据拿到"此刻"的时间
    - action: homeassistant.update_entity
      target:
        entity_id:
          - sensor.doorwatch_it_office_door_state
          - binary_sensor.doorwatch_it_office_door_readable

    # ② 判断还活着没有
    - if:
        - condition: template
          value_template: >
            {% set raw = states.binary_sensor.isa_dw2hl_b95b_magnet_sensor %}
            {% set ts = raw.last_reported | default(raw.last_updated, true) %}
            {% set fresh = false %}
            {% if raw is not none and ts is defined and ts is not none and ts.year is defined %}
              {% set fresh = (as_timestamp(now()) - as_timestamp(ts)) < 180 %}
            {% endif %}
            {% set r = states.binary_sensor.doorwatch_it_office_door_readable %}
            {% set actual = states('sensor.doorwatch_it_office_door_state') %}
            {{ fresh and r is not none and r.state == 'on' and actual in ['OPEN', 'CLOSED'] }}
      then:
        - action: mqtt.publish
          data:
            topic: "doorwatch/it-office-door/state"
            payload: "{{ states('sensor.doorwatch_it_office_door_state') }}"
            qos: 1
            retain: true
        - action: mqtt.publish
          data:
            topic: "doorwatch/it-office-door/heartbeat"
            payload: "alive"
            qos: 1
            retain: false
      else:
        # 读不到传感器 → 立刻告诉 doorwatch "状态未知"。
        # 不等它自己超时,因为超时窗口里它显示的是上次的开/关。
        - action: mqtt.publish
          data:
            topic: "doorwatch/it-office-door/status"
            payload: "offline"
            qos: 1
            retain: false

- id: doorwatch_it_office_startup
  alias: "HA 启动 → 补发一次(IT 办公室)"
  description: "HA 重启后补发当前状态,避免看板长时间停留在旧状态。"
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    # 等一分钟,让 xiaomi_miot 集成连上米家云、完成第一次轮询
    - delay: "00:01:00"
    - action: homeassistant.update_entity
      target:
        entity_id:
          - sensor.doorwatch_it_office_door_state
          - binary_sensor.doorwatch_it_office_door_readable
    - if:
        - condition: template
          value_template: >
            {% set raw = states.binary_sensor.isa_dw2hl_b95b_magnet_sensor %}
            {% set ts = raw.last_reported | default(raw.last_updated, true) %}
            {% set fresh = false %}
            {% if raw is not none and ts is defined and ts is not none and ts.year is defined %}
              {% set fresh = (as_timestamp(now()) - as_timestamp(ts)) < 180 %}
            {% endif %}
            {% set r = states.binary_sensor.doorwatch_it_office_door_readable %}
            {% set actual = states('sensor.doorwatch_it_office_door_state') %}
            {{ fresh and r is not none and r.state == 'on' and actual in ['OPEN', 'CLOSED'] }}
      then:
        - action: mqtt.publish
          data:
            topic: "doorwatch/it-office-door/state"
            payload: "{{ states('sensor.doorwatch_it_office_door_state') }}"
            qos: 1
            retain: true
        - action: mqtt.publish
          data:
            topic: "doorwatch/it-office-door/heartbeat"
            payload: "alive"
            qos: 1
            retain: false
      else:
        # 启动时传感器就读不到 —— 老老实实说不知道。
        # doorwatch 收到 UNKNOWN 会把状态打回 unknown + 离线。
        - action: mqtt.publish
          data:
            topic: "doorwatch/it-office-door/state"
            payload: "{{ states('sensor.doorwatch_it_office_door_state') }}"
            qos: 1
            retain: true
        - action: mqtt.publish
          data:
            topic: "doorwatch/it-office-door/status"
            payload: "offline"
            qos: 1
            retain: false

# ---------------------------------------------------------------------
#  门磁电量 → doorwatch
# ---------------------------------------------------------------------
#
#  为什么要有这条:
#   蓝牙 + 云端这条路有个绕不开的盲区 ——
#   门磁自己没电了,但网关和云都正常时,云端会**继续返回最后一次的值**。
#   看板测不出"传感器已经死了",只能一直显示上次的开/关。
#
#   电量是唯一能提前发现这件事的信号:低到一定程度就该换电池了。
#   (ESP32 方案里传感器一断电心跳立刻停,不需要这条;
#    蓝牙方案没有那个信号,只能靠电量。)
#
#  xiaomi_miot 的电量是**属性**(battery_level),不是独立实体 ——
#  所以用 state_attr() 取。有些集成会另外暴露 sensor.xxx_battery,
#  那种就去掉 state_attr() 直接盯那个实体。
#
#  ★ 发电量**不会**刷新 doorwatch 的心跳,服务端认得出来:
#    电量是"顺便报一下的",不能证明"门状态刚刚读到过"。
#    一台没电的设备要是还在报电量,看板必须继续显示「状态未知」。
# ---------------------------------------------------------------------
- id: doorwatch_it_office_battery
  alias: "门磁电量 → doorwatch(IT 办公室)"
  description: "定期把门磁电量推给 doorwatch,看板在电量低时提醒换电池。"
  mode: single
  triggers:
    # 每半小时报一次(电池不会突然没电,不用更勤)
    - trigger: time_pattern
      minutes: "/30"
    # 电量一有变化就立刻报
    - trigger: numeric_state
      entity_id: binary_sensor.isa_dw2hl_b95b_magnet_sensor
      attribute: battery_level
      below: 100
  actions:
    - if:
        - condition: template
          value_template: >
            {% set b = state_attr('binary_sensor.isa_dw2hl_b95b_magnet_sensor', 'battery_level') %}
            {{ b is not none and b is number }}
      then:
        - action: mqtt.publish
          data:
            topic: "doorwatch/it-office-door/battery"
            payload: "{{ state_attr('binary_sensor.isa_dw2hl_b95b_magnet_sensor', 'battery_level') }}"
            qos: 1
            retain: true

