<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IT 办公室" />
    <meta name="description" content="查看 IT 办公室是否关门,不用白跑一趟" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <title>IT 办公室状态</title>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__title">
        <img class="topbar__logo" src="/icon.svg" alt="" width="34" height="34" />
        <div>
          <h1>IT 办公室</h1>
          <p class="topbar__sub" id="subtitle">正在连接…</p>
        </div>
      </div>
      <div class="topbar__actions">
        <!-- 「管理」以前在页脚,页脚腾给品牌署名之后挪到页头 -->
        <button class="topbar__manage" id="manage-btn" type="button">管理</button>
        <!-- 语言切换:按钮上显示的是另一种语言的名字 -->
        <button class="topbar__lang" id="lang-toggle" type="button" aria-label="切换语言">
          EN
        </button>
        <button class="topbar__refresh" id="refresh" type="button" aria-label="刷新">
          <span class="dot" id="conn-dot"></span>
        </button>
      </div>
    </header>

    <main id="doors" class="doors">
      <div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div>
    </main>

    <footer class="footer">
      <p class="footer__hint" id="footer-hint">一眼知门况，免跑空一趟。</p>
      <p class="footer__brand" id="footer-brand">Powered By IT Dept</p>
    </footer>

    <div class="sheet" id="manage-sheet" hidden>
      <div class="sheet__panel">
        <div class="sheet__head">
          <h2 id="manage-title">管理</h2>
          <button class="sheet__close" id="manage-close" type="button" aria-label="关闭">✕</button>
        </div>
        <div class="sheet__body" id="manage-body"></div>
      </div>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
