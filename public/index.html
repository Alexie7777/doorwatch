<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="不徒步" />
    <meta name="description" content="不徒步 · nohike —— 查看 IT 办公室是否关门,不用白跑一趟" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <title>不徒步 · nohike — IT 办公室状态</title>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__title">
        <img class="topbar__logo" src="/icon.svg" alt="" width="34" height="34" />
        <div>
          <h1>不徒步 · nohike</h1>
        </div>
      </div>
      <div class="topbar__actions">
        <!-- 语言切换:按钮上显示的是另一种语言的名字 -->
        <button class="topbar__lang" id="lang-toggle" type="button" aria-label="切换语言">
          EN
        </button>
        <button class="topbar__refresh" id="refresh" type="button" aria-label="刷新">
          <span class="dot" id="conn-dot"></span>
        </button>
      </div>
    </header>

    <main id="doors" class="doors">
      <div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div>
    </main>

    <footer class="footer">
      <p class="footer__hint" id="footer-hint">一眼知门况，免跑空一趟。</p>
      <p class="footer__brand" id="footer-brand">Powered By 不徒步 · nohike | IT Dept BIPH</p>
    </footer>

    <!-- 值班微信二维码:点提示语里的「值班微信」弹出来 -->
    <div class="qr-modal" id="qr-modal" hidden>
      <div class="qr-modal__card">
        <button class="qr-modal__close" id="qr-close" type="button" aria-label="关闭">✕</button>
        <img class="qr-modal__img" id="qr-img" alt="" />
        <p class="qr-modal__caption" id="qr-caption"></p>
      </div>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
