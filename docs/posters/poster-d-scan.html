<!DOCTYPE html><html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1754, height=1240">
  <script src="assets/tailwind.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
  <div class="w-[1754px] h-[1240px] overflow-hidden relative bg-[#0b0f14] flex text-[#e6edf3]" data-sd-id="1">
    
    <!-- Left Zone: Phone Mockup (46%) -->
    <div class="w-[46%] h-full flex flex-col items-center justify-center border-r border-[#24303c]" data-sd-id="2">
            <img src="assets/phone-angle.png"
           class="w-[540px] drop-shadow-[0_36px_64px_rgba(0,0,0,0.6)]"
           alt="真机实拍:手机上的门磁看板" data-sd-id="3">
      <!-- Caption -->
        <p class="mt-8 text-[24px] text-[#8b9bab] tracking-wide text-center" data-sd-id="8">扫一下，手机上就是这个页面</p>
    </div>

    <!-- Right Zone: Info Column (54%) -->
    <div class="w-[54%] h-full pl-[80px] pr-[100px] py-[56px] flex flex-col justify-between" data-sd-id="9">
      
      <!-- Top Content -->
      <div data-sd-id="10">
        <span class="text-[32px] font-medium text-[#1f6feb] tracking-tight block mb-8" data-sd-id="11">不徒步 · nohike</span>
        <h1 class="text-[72px] font-bold leading-[1.15] tracking-tight mb-6 text-white" data-sd-id="12">
          出门前扫一眼，<br>省下一趟白跑。
        </h1>
        <p class="text-[32px] text-[#8b9bab] leading-relaxed mb-10" data-sd-id="13">
          IT 办公室的门开着还是关着，手机上就能看。
        </p>

        <!-- Benefits -->
        <div class="space-y-8 mb-14" data-sd-id="14">
          <div class="flex items-start" data-sd-id="15">
            <div class="w-[3px] h-[32px] bg-[#2ea043] mr-6 mt-1.5" data-sd-id="16"></div>
            <p class="text-[28px] text-[#e6edf3]" data-sd-id="17">门开着还是门关着，一眼就看清楚</p>
          </div>
          <div class="flex items-start" data-sd-id="18">
            <div class="w-[3px] h-[32px] bg-[#1f6feb] mr-6 mt-1.5" data-sd-id="19"></div>
            <p class="text-[28px] text-[#e6edf3]" data-sd-id="20">有人在就直接去，不在就不用白跑一趟</p>
          </div>
          <div class="flex items-start" data-sd-id="21">
            <div class="w-[3px] h-[32px] bg-[#d29922] mr-6 mt-1.5" data-sd-id="22"></div>
            <p class="text-[28px] text-[#e6edf3]" data-sd-id="23">实在看不出来，它会老实说「不知道」，不糊弄你</p>
          </div>
        </div>
      </div>

      <!-- QR Block -->
      <div class="flex items-end gap-10" data-sd-id="24">
        <div class="flex flex-col" data-sd-id="25">
          <p class="text-[24px] text-[#8b9bab] mb-6" data-sd-id="26">用手机相机或微信扫一扫</p>
          <div class="w-[348px] h-[348px] bg-black rounded-[24px] p-[24px] flex items-center justify-center border border-[#24303c]" data-sd-id="27">
            <img src="assets/qr-nohike-inv.png" class="w-full h-full" alt="QR Code" data-sd-id="28">
          </div>
        </div>
        
        <div class="pb-4 flex flex-col gap-2" data-sd-id="29">
          <a id="url-link" href="http://nohike.biph.com/" class="text-[30px] font-medium text-[#e6edf3] hover:text-[#1f6feb] transition-colors" data-sd-id="30">http://nohike.biph.com/</a>
          <p class="text-[20px] text-[#8b9bab]" data-sd-id="31">需在学校网络内访问</p>
        </div>
      </div>

      <!-- Footer -->
      <div class="pt-8 border-t border-[#24303c] flex justify-between items-center" data-sd-id="32">
        <p class="text-[22px] text-[#8b9bab] font-light tracking-wide" data-sd-id="33">
          Powered By 不徒步 · nohike | IT Dept BIPH
        </p>
      </div>

    </div>

  </div>

</body></html>
