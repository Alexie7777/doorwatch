<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <script src="assets/tailwind.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        body {
            margin: 0;
            padding: 0;
            background: #0b0f14;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .headline {
            line-height: 0.95;
            letter-spacing: -0.04em;
        }
        
        .accent-glow {
            background: radial-gradient(circle at 70% 30%, rgba(31, 111, 235, 0.08) 0%, transparent 60%);
        }
    </style>
</head>
<body>
    <div class="w-[1754px] h-[1240px] overflow-hidden relative bg-[#0b0f14] text-[#e6edf3]" data-sd-id="1">
        <!-- Background Effects -->
        <div class="absolute inset-0 accent-glow" data-sd-id="2"></div>
        

        <!-- Main Content Layout -->
        <div class="relative z-10 w-full h-full flex flex-col px-[80px] py-[56px]" data-sd-id="4">
            
            <!-- Upper Section: Hero Type Block -->
            <div class="flex-1 flex flex-col justify-center mb-[40px]" data-sd-id="5">
                <!-- Eyebrow -->
                <div class="mb-8" data-sd-id="6">
                    <span class="text-[#8b9bab] text-[28px] font-medium tracking-[0.2em]" data-sd-id="7">
                        不徒步 · nohike
                    </span>
                </div>

                <!-- Headline Block -->
                <h1 class="headline text-[190px] font-black text-white max-w-[1400px]" data-sd-id="8">
                    出门前扫一眼，<br>省下一趟白跑。
                </h1>

                <!-- Subhead -->
                <div class="mt-12" data-sd-id="9">
                    <p class="text-[#58a6ff] text-[36px] font-semibold tracking-tight" data-sd-id="10">
                        IT 办公室门磁看板 · 门磁 → MQTT → 手机网页
                    </p>
                </div>
            </div>

            <!-- Middle Section: Value Points Grid -->
            <div class="grid grid-cols-3 gap-0 border-t border-b border-[#24303c] py-16" data-sd-id="11">
                <div class="pr-12 border-r border-[#24303c]" data-sd-id="12">
                    <p class="text-[#e6edf3] text-[24px] leading-relaxed font-medium" data-sd-id="13">
                        门开着还是门关着，<br>手机上 2 秒看清
                    </p>
                </div>
                <div class="px-12 border-r border-[#24303c]" data-sd-id="14">
                    <p class="text-[#e6edf3] text-[24px] leading-relaxed font-medium" data-sd-id="15">
                        传感器掉线就说「状态未知」，<br>绝不拿上次的开/关糊弄你
                    </p>
                </div>
                <div class="pl-12" data-sd-id="16">
                    <p class="text-[#e6edf3] text-[24px] leading-relaxed font-medium" data-sd-id="17">
                        单容器部署，自带 MQTT broker，<br>有一台 Docker 机器就能跑
                    </p>
                </div>
            </div>

            <!-- Lower Section: Flow and Visual Accent -->
            <div class="mt-12 flex items-end justify-between" data-sd-id="18">
                <!-- Flow Chain -->
                <div class="flex items-center gap-6 text-[#8b9bab] text-[20px] tracking-wide" data-sd-id="19">
                    <span data-sd-id="20">门磁传感器</span>
                    <span class="text-[#24303c]" data-sd-id="21">→</span>
                    <span data-sd-id="22">MQTT</span>
                    <span class="text-[#24303c]" data-sd-id="23">→</span>
                    <span data-sd-id="24">服务端</span>
                    <span class="text-[#24303c]" data-sd-id="25">→</span>
                    <span class="text-[#56d364] font-semibold" data-sd-id="26">手机看板</span>
                </div>

                <!-- Screenshot Accent -->
                <div class="w-[400px] h-[272px] rounded-[16px] border border-[#24303c] overflow-hidden opacity-50 relative group" data-sd-id="27">
                     <img src="assets/dashboard-cards.png" alt="Dashboard Preview" class="w-full h-full object-cover object-top" data-sd-id="28">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f14] to-transparent opacity-40" data-sd-id="29"></div>
                </div>
            </div>

            <!-- Footer -->
            <div class="mt-auto pt-8 flex justify-between items-center text-[#5c6a79] text-[16px] tracking-widest" data-sd-id="30">
                <div data-sd-id="31">Powered By 不徒步 · nohike | IT Dept BIPH</div>
                <div class="w-[80px] h-[1px] bg-[#24303c]" data-sd-id="32"></div>
            </div>
        </div>

        <!-- Structural Hairlines for visual tension -->
        <div class="absolute left-[80px] top-0 w-[1px] h-full bg-[#24303c] opacity-30" data-sd-id="33"></div>
        <div class="absolute right-[80px] top-0 w-[1px] h-full bg-[#24303c] opacity-30" data-sd-id="34"></div>
    </div>

</body></html>
