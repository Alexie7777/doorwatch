# =====================================================================
#  IT 办公室门磁 —— ESPHome 固件(USB 供电版,推荐)
#
#  为什么这么设计:
#    1. 心跳每 60s 一跳。门一直关着的话,一天可能只有一次状态上报,
#       只看状态消息的话,服务器会误以为传感器掉线 —— 所以必须有独立心跳。
#    2. state 用 retain:true。服务器重启后订阅主题,能立刻拿到最后状态,
#       不用等下一次开关门。
#    3. 用遗嘱消息(shutdown_message)声明离线。设备突然断电时,
#       Broker 会替它发一条 offline,看板立刻显示"状态未知"。
#
#  接线(以 GPIO21 为例):
#
#      ESP32 GND  ─────┬───── 门磁 COM
#                     │
#      ESP32 GPIO21 ──┴───── 门磁 NO
#
#    门磁的磁铁(半片)固定在门扇上,门关上时磁铁靠近接线盒这半片,接点闭合。
#    于是:
#        门开 → 接点断开 → GPIO 被内部上拉拉高 → HIGH
#        门关 → 接点闭合 → GPIO 被接地       → LOW
#
#    接线前先用万用表通断档量一下:磁铁靠近应该"通",离开应该"断"。
#    门磁有极性,装反了不吸合。
#
#  烧录:
#    1. 把 secrets.example.yaml 复制成 secrets.yaml 并填好
#    2. pip install esphome
#    3. esphome run it-office-door.yaml
#       (首次会编译固件,连上串口烧录;之后可以用 esphome run --device 网关名 OTA)
# =====================================================================

substitutions:
  device_name: it-office-door
  friendly_name: "IT 办公室门磁"
  mqtt_broker_ip: "192.168.1.10"      # ← 改成部署 doorwatch 的那台机器的 IP
  mqtt_port: "1883"
  mqtt_topic_prefix: doorwatch/it-office-door
  door_pin: GPIO21

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  reboot_timeout: 15min

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none          # 门磁上报延迟要准,别省电
  ap:
    ssid: "IT-Door-Setup"
    password: !secret ap_password
  captive_portal:                # 连不上 WiFi 时开热点,用手机配网

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Shanghai

# ---------------------------------------------------------------------
#  门磁
# ---------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: door_contact
    pin:
      number: ${door_pin}
      pullup: true
      inverted: false
    device_class: door
    filters:
      # 去抖:门被风吹一下、有人推一把都会抖好几秒,滤掉
      - delayed_on: 1000ms
      - delayed_off: 1000ms
    on_press:
      - logger.log: "门被打开了"
    on_release:
      - logger.log: "门关上了"

# ---------------------------------------------------------------------
#  MQTT
# ---------------------------------------------------------------------
mqtt:
  broker: ${mqtt_broker_ip}
  port: ${mqtt_port}
  username: ""
  password: ""
  discovery: false
  log_topic: null

  # 连接建立时发 online
  birth_message:
    topic: ${mqtt_topic_prefix}/status
    payload: online
    qos: 1
    retain: false

  # 掉电/离线时由 Broker 代发 offline(遗嘱消息)
  shutdown_message:
    topic: ${mqtt_topic_prefix}/status
    payload: offline
    qos: 1
    retain: false

  binary_sensor:
    - id: door_contact
      state_topic: ${mqtt_topic_prefix}/state
      payload_on: "OPEN"
      payload_off: "CLOSED"
      qos: 1
      retain: true

script:
  - id: publish_heartbeat
    then:
      - lambda: |-
          if (mqtt_client->is_connected()) {
            mqtt_client->publish("${mqtt_topic_prefix}/heartbeat", "alive", false);
          }

interval:
  # 心跳:告诉服务器"我还活着"
  - interval: 60s
    then:
      - script.execute: publish_heartbeat

status_led:
  pin:
    number: GPIO2
    inverted: false

# 想在浏览器里调试的话,取消下面注释(会多占一点 Flash)
# web_server:
#   port: 80
#   logger: false
