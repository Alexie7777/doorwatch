services:
  doorwatch:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: doorwatch:1.0.0
    container_name: doorwatch
    restart: unless-stopped
    ports:
      # 看板(纯 HTTP):把 8443 映射出来
      - "8443:8443"
      # MQTT broker:ESP32 传感器要连这个端口
      - "1883:1883"
      # 校园网开了 AP 隔离、手机访问不到映射端口时,
      # 改成 network_mode: host(仅 Linux),并在下面注释掉 ports
    # network_mode: host
    environment:
      TZ: Asia/Shanghai
      PORT: "8443"
      # ★ 纯 HTTP —— 微信内置浏览器打不开自签证书的 HTTPS。
      #   它直接显示「无法访问此网站」,连「高级 → 继续前往」都不给,
      #   所以要在微信里发链接给同事,必须走 http://。
      #   想换回 HTTPS:改成 "true",端口不变。
      HTTPS: "false"
      MQTT_PORT: "1883"
      DATA_DIR: /data
      # 自签证书的 SAN 里要写上你实际用的域名/IP,逗号分隔
      # (纯 HTTP 模式下用不到,留着是为了随时能切回 HTTPS)
      CERT_NAMES: "${CERT_NAMES:-}"
      # 电池版传感器要放宽到 45 分钟;USB 供电保持默认 180 秒
      ONLINE_TIMEOUT_MS: "${ONLINE_TIMEOUT_MS:-180000}"
      # 写操作密钥,留空则首次启动自动生成到 /data/ADMIN_KEY.txt
      ADMIN_KEY: "${ADMIN_KEY:-}"
      LOG_LEVEL: info
    volumes:
      # SQLite 数据库 / 自签证书 / 管理密钥 都持久化在这里
      - doorwatch-data:/data
    healthcheck:
      # 要同时认 HTTPS 和纯 HTTP:
      #   - 纯 HTTP 部署时,写死 https:// 会一直 unhealthy
      #   - HTTPS 部署时,自签证书会被 fetch 拒掉,同样 unhealthy
      # 所以两种协议都试,HTTPS 那一路显式放行自签证书。
      test:
        - CMD
        - node
        - -e
        - "const h=require('http'),s=require('https');const g=(u,o)=>new Promise(r=>{const c=(u.startsWith('https')?s:h).get(u,o,x=>{x.resume();r(x.statusCode===200)});c.on('error',()=>r(false));c.setTimeout(4000,()=>{c.destroy();r(false)})});(async()=>{for(const p of [['https://127.0.0.1:8443/api/health',{rejectUnauthorized:false}],['http://127.0.0.1:8443/api/health',{}]]){if(await g(p[0],p[1])){process.exit(0)}}process.exit(1)})()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  doorwatch-data:
